<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Full Bleed) -->
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="mCyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="mPurpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="mOrangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="mYellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for Android masking -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Background Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Safe Zone Group: Scaled down 75% centered so Android maskable safe zone is respected -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- T-Piece (Center-Top Purple) -->
    <g>
      <rect x="226" y="130" width="60" height="60" rx="8" fill="url(#mPurpleGrad)" stroke="#e9d5ff" stroke-width="2" />
      <rect x="228" y="132" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <g>
      <rect x="162" y="194" width="60" height="60" rx="8" fill="url(#mPurpleGrad)" stroke="#e9d5ff" stroke-width="2" />
      <rect x="164" y="196" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <g>
      <rect x="226" y="194" width="60" height="60" rx="8" fill="url(#mPurpleGrad)" stroke="#e9d5ff" stroke-width="2" />
      <rect x="228" y="196" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <g>
      <rect x="290" y="194" width="60" height="60" rx="8" fill="url(#mPurpleGrad)" stroke="#e9d5ff" stroke-width="2" />
      <rect x="292" y="196" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>

    <!-- L-Piece (Orange) -->
    <g>
      <rect x="98" y="258" width="60" height="60" rx="8" fill="url(#mOrangeGrad)" stroke="#fed7aa" stroke-width="2" />
      <rect x="100" y="260" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <g>
      <rect x="98" y="322" width="60" height="60" rx="8" fill="url(#mOrangeGrad)" stroke="#fed7aa" stroke-width="2" />
      <rect x="100" y="324" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <g>
      <rect x="162" y="322" width="60" height="60" rx="8" fill="url(#mOrangeGrad)" stroke="#fed7aa" stroke-width="2" />
      <rect x="164" y="324" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <g>
      <rect x="226" y="322" width="60" height="60" rx="8" fill="url(#mOrangeGrad)" stroke="#fed7aa" stroke-width="2" />
      <rect x="228" y="324" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>

    <!-- I-Piece (Cyan) -->
    <g>
      <rect x="354" y="130" width="60" height="60" rx="8" fill="url(#mCyanGrad)" stroke="#bae6fd" stroke-width="2" />
      <rect x="356" y="132" width="56" height="18" rx="4" fill="#ffffff" opacity="0.35" />
    </g>
    <g>
      <rect x="354" y="194" width="60" height="60" rx="8" fill="url(#mCyanGrad)" stroke="#bae6fd" stroke-width="2" />
      <rect x="356" y="196" width="56" height="18" rx="4" fill="#ffffff" opacity="0.35" />
    </g>
    <g>
      <rect x="354" y="258" width="60" height="60" rx="8" fill="url(#mCyanGrad)" stroke="#bae6fd" stroke-width="2" />
      <rect x="356" y="260" width="56" height="18" rx="4" fill="#ffffff" opacity="0.35" />
    </g>
    <g>
      <rect x="354" y="322" width="60" height="60" rx="8" fill="url(#mCyanGrad)" stroke="#bae6fd" stroke-width="2" />
      <rect x="356" y="324" width="56" height="18" rx="4" fill="#ffffff" opacity="0.35" />
    </g>

    <!-- Yellow (O-piece) -->
    <g>
      <rect x="290" y="258" width="60" height="60" rx="8" fill="url(#mYellowGrad)" stroke="#fef08a" stroke-width="2" />
      <rect x="292" y="260" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <g>
      <rect x="290" y="322" width="60" height="60" rx="8" fill="url(#mYellowGrad)" stroke="#fef08a" stroke-width="2" />
      <rect x="292" y="324" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
  </g>
</svg>
