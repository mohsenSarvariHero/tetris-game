<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Block Gradients -->
    <!-- Cyan (I) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Purple (T) -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Orange (L) -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Yellow (O) -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Filters for Glow & Bevel -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="3" />

  <!-- Background Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />

    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Ambient Glow Behind Blocks -->
  <circle cx="256" cy="256" r="140" fill="url(#cyanGrad)" opacity="0.12" filter="url(#neonGlow)" />

  <!-- TETROMINO BLOCKS (64x64 scale per mino) -->
  <g filter="url(#softShadow)">
    <!-- T-Piece (Center-Top Purple): (224, 128), (160, 192), (224, 192), (288, 192) -->
    <!-- Top Mino -->
    <g>
      <rect x="226" y="130" width="60" height="60" rx="8" fill="url(#purpleGrad)" stroke="#e9d5ff" stroke-width="2" />
      <rect x="228" y="132" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <!-- Left Mino -->
    <g>
      <rect x="162" y="194" width="60" height="60" rx="8" fill="url(#purpleGrad)" stroke="#e9d5ff" stroke-width="2" />
      <rect x="164" y="196" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <!-- Center Mino -->
    <g>
      <rect x="226" y="194" width="60" height="60" rx="8" fill="url(#purpleGrad)" stroke="#e9d5ff" stroke-width="2" />
      <rect x="228" y="196" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <!-- Right Mino -->
    <g>
      <rect x="290" y="194" width="60" height="60" rx="8" fill="url(#purpleGrad)" stroke="#e9d5ff" stroke-width="2" />
      <rect x="292" y="196" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>

    <!-- L-Piece (Orange - Left): (98, 258), (98, 322), (162, 322), (226, 322) -->
    <g>
      <rect x="98" y="258" width="60" height="60" rx="8" fill="url(#orangeGrad)" stroke="#fed7aa" stroke-width="2" />
      <rect x="100" y="260" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <g>
      <rect x="98" y="322" width="60" height="60" rx="8" fill="url(#orangeGrad)" stroke="#fed7aa" stroke-width="2" />
      <rect x="100" y="324" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <g>
      <rect x="162" y="322" width="60" height="60" rx="8" fill="url(#orangeGrad)" stroke="#fed7aa" stroke-width="2" />
      <rect x="164" y="324" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <g>
      <rect x="226" y="322" width="60" height="60" rx="8" fill="url(#orangeGrad)" stroke="#fed7aa" stroke-width="2" />
      <rect x="228" y="324" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>

    <!-- I-Piece (Cyan - Right Vertical): (354, 130), (354, 194), (354, 258), (354, 322) -->
    <g>
      <rect x="354" y="130" width="60" height="60" rx="8" fill="url(#cyanGrad)" stroke="#bae6fd" stroke-width="2" />
      <rect x="356" y="132" width="56" height="18" rx="4" fill="#ffffff" opacity="0.35" />
    </g>
    <g>
      <rect x="354" y="194" width="60" height="60" rx="8" fill="url(#cyanGrad)" stroke="#bae6fd" stroke-width="2" />
      <rect x="356" y="196" width="56" height="18" rx="4" fill="#ffffff" opacity="0.35" />
    </g>
    <g>
      <rect x="354" y="258" width="60" height="60" rx="8" fill="url(#cyanGrad)" stroke="#bae6fd" stroke-width="2" />
      <rect x="356" y="260" width="56" height="18" rx="4" fill="#ffffff" opacity="0.35" />
    </g>
    <g>
      <rect x="354" y="322" width="60" height="60" rx="8" fill="url(#cyanGrad)" stroke="#bae6fd" stroke-width="2" />
      <rect x="356" y="324" width="56" height="18" rx="4" fill="#ffffff" opacity="0.35" />
    </g>

    <!-- Yellow (O-piece 2x2 Accent at bottom right): (290, 258), (290, 322) -->
    <g>
      <rect x="290" y="258" width="60" height="60" rx="8" fill="url(#yellowGrad)" stroke="#fef08a" stroke-width="2" />
      <rect x="292" y="260" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
    <g>
      <rect x="290" y="322" width="60" height="60" rx="8" fill="url(#yellowGrad)" stroke="#fef08a" stroke-width="2" />
      <rect x="292" y="324" width="56" height="18" rx="4" fill="#ffffff" opacity="0.3" />
    </g>
  </g>
</svg>
